; Container WORKER: filas + scheduler. INSTANCIA UNICA.
;
; Nunca rodar duas ao mesmo tempo: dois schedulers duplicariam os jobs agendados
; (LinkHealthCheckJob de hora em hora, clicks:anonymize-ips diario as 04:10).
;
; Nao serve HTTP e nao entra no blue/green — o deploy dele e recriacao simples.
; Durante a troca os jobs apenas aguardam no Redis, sem impacto para o usuario.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor/

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
user=www
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/worker.log
stopwaitsecs=3600
priority=1

[program:laravel-schedule]
command=php /var/www/artisan schedule:work
autostart=true
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/schedule.log
priority=2
