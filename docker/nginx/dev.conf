# HTTP server (interno do container)
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;


    # Configurações de produção otimizadas
    client_max_body_size 32M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Logs para produção
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # API routes - Laravel CORS gerencia os headers
    location ~* ^/api/.*$ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Espelha o roteamento de producao (vhost wildcard): a RAIZ exata vai para
    # o FRONTEND — e assim que a bio renderiza no host do subdominio com a URL
    # preservada (ex: discord.localhost/). Custo aceito em dev: localhost/
    # tambem mostra o frontend em vez do welcome JSON do Laravel. Todos os
    # demais paths (/{slug}, /api, /health) seguem no backend normalmente.
    location = / {
        proxy_pass         http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Assets do Next.js (chunks/CSS/fontes) carregados pela pagina bio servida
    # em `location = /` acima. Sem isto, a regex de cache de assets logo abaixo
    # tentava servi-los do public/ do Laravel (que nao os tem) e a hidratacao
    # do React falhava por completo — 404 em todo _next/static/*, sem chegar a
    # rodar nenhum provider client-side (Auth0, GA, etc). `^~` garante
    # precedencia sobre a regex de cache de assets para o mesmo prefixo.
    # Upgrade/Connection habilitam o websocket do HMR do Turbopack
    # (/_next/webpack-hmr), igual ao vhost de producao (linkchart-frontend).
    location ^~ /_next/ {
        proxy_pass         http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Rotas do SDK @auth0/nextjs-auth0 (login/logout/callback/profile/etc),
    # resolvidas pelo `middleware.ts` do Next — nao existe prefixo `/auth/*`
    # no Laravel (so `/api/auth/*`, ver routes/api.php), entao nao ha colisao.
    # Sem isto, `useUser()` (client-side, roda em todo provider global) batia
    # no catch-all do Laravel: 404 interpretado pelo SDK como sessao invalida
    # ("Auth0 session error: Error: Unauthorized") mesmo para visitante
    # deslogado — quando alcança o Next corretamente a resposta e um 204 limpo
    # (confirmado direto na porta 3000).
    location ^~ /auth/ {
        proxy_pass         http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Icone gerado pelo App Router (app/layout.tsx -> metadata.icons) —
    # Laravel nunca teve favicon/icon proprios (public/ nao tem nenhum dos
    # dois), entao redirecionar para o frontend so fecha um 404 sem mudar
    # comportamento em nenhum host existente.
    location = /icon.svg {
        proxy_pass         http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Laravel routes (incluindo rotas API que não começam com /api)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Configurações para produção
        fastcgi_buffer_size 64k;
        fastcgi_buffers 8 128k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
        fastcgi_connect_timeout 60s;

        # Performance
        fastcgi_intercept_errors on;
        fastcgi_keep_conn on;
    }

    # Cache para assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        gzip_static on;
    }

    # Compressão adicional para outros arquivos
    location ~* \.(json|xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public";
        gzip_static on;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|htaccess|md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquear acesso a diretórios sensíveis
    location ~ /(vendor|storage|bootstrap|config|database|resources|routes|tests)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # API status endpoint
    location /api/status {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Robots.txt e favicon
    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Laravel's public/ never had its own favicon.ico (this always 404'd on
    # every host); the frontend owns one via App Router (app/favicon.ico), so
    # proxy there instead — closes the 404 the bio page hits at this host
    # without changing behavior anywhere a favicon previously existed.
    location = /favicon.ico {
        access_log off;
        proxy_pass         http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
