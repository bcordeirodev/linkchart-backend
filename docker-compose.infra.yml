# Stack de INFRA: banco, cache, telemetria. Tudo que tem ESTADO.
#
# ⚠️ SEMPRE subir com `-p linkchartapi`:
#     docker compose -p linkchartapi -f docker-compose.infra.yml up -d
#
# Os volumes do Docker sao escopados pelo NOME DO PROJETO Compose. Os que
# existem em producao sao `linkchartapi_postgres_data` e `linkchartapi_redis_data`.
# Com qualquer outro `-p`, o Docker cria volumes NOVOS E VAZIOS — e o banco
# parece apagado. Nao e hipotese: e o comportamento padrao.
#
# NENHUM deploy de aplicacao toca esta stack. Ela so e mexida em manutencao
# explicita de infraestrutura. Antes, `docker compose down` no deploy derrubava
# postgres e redis junto com a app a cada release (~2,5 min de banco fora).

services:
  database:
    image: postgres:15-alpine
    container_name: linkchartdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkchartprod
      POSTGRES_USER: linkchartuser
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - linkchartnet
      - linkcharts-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkchartuser -d linkchartprod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: linkchartredis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass CHANGE_ME_REDIS_PASSWORD
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - linkchartnet
      - linkcharts-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "CHANGE_ME_REDIS_PASSWORD", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: linkchart-pg-exporter
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring:${PG_MONITORING_PASSWORD}@linkchartdb:5432/linkchartprod?sslmode=disable"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - linkchartnet

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: linkchart-redis-exporter
    restart: unless-stopped
    mem_limit: 128m
    environment:
      REDIS_ADDR: "redis://linkchartredis:6379"
      REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - linkchartnet

  alloy:
    image: grafana/alloy:v1.17.0
    container_name: linkchart-alloy
    restart: unless-stopped
    mem_limit: 512m
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=experimental # deltatocumulative (+ filelog) exigem isto
      - /etc/alloy/config.alloy
    volumes:
      - ./ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /:/rootfs:ro,rslave # host metrics (prometheus.exporter.unix)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/nginx:/var/log/nginx:ro
    environment:
      GCLOUD_OTLP_ENDPOINT: "${GCLOUD_OTLP_ENDPOINT}"
      GCLOUD_OTLP_USER: "${GCLOUD_OTLP_USER}"
      GCLOUD_OTLP_PASS: "${GCLOUD_OTLP_PASS}"
    depends_on:
      - postgres_exporter
      - redis_exporter
    networks:
      - linkchartnet
    # 12345 nao publicado — UI de debug interna.

volumes:
  postgres_data:
  redis_data:

networks:
  linkchartnet:
    driver: bridge
  linkcharts-network:
    external: true
