services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkchartapi
    restart: unless-stopped
    ports:
      - "8000:80"   # HTTP - Backend API
    volumes:
      - ./storage/logs:/var/www/storage/logs
      - ./storage/app:/var/www/storage/app
      - ./.env.production:/var/www/.env
      - /var/log/nginx:/var/log/nginx
    environment:
      - CONTAINER_ROLE=app
      - DB_HOST=linkchartdb
      - REDIS_HOST=linkchartredis
      - DB_CONNECTION=pgsql
      - DB_DATABASE=linkchartprod
      - DB_USERNAME=linkchartuser
      - DB_PASSWORD=linkchartpassword123
      - REDIS_CLIENT=phpredis
      - REDIS_PASSWORD=linkchartredis123
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linkchartnet
      - linkcharts-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  database:
    image: postgres:15-alpine
    container_name: linkchartdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkchartprod
      POSTGRES_USER: linkchartuser
      POSTGRES_PASSWORD: linkchartpassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - linkchartnet
      - linkcharts-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkchartuser -d linkchartprod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: linkchartredis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass linkchartredis123
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - linkchartnet
      - linkcharts-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "linkchartredis123", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: linkchart-pg-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring:${PG_MONITORING_PASSWORD}@linkchartdb:5432/linkchartprod?sslmode=disable"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - linkchartnet

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: linkchart-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://linkchartredis:6379"
      REDIS_PASSWORD: "linkchartredis123"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - linkchartnet

  alloy:
    image: grafana/alloy:v1.17.0
    container_name: linkchart-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=experimental   # deltatocumulative (+ filelog) require this
      - /etc/alloy/config.alloy
    volumes:
      - ./ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /:/rootfs:ro,rslave            # host metrics (prometheus.exporter.unix)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/nginx:/var/log/nginx:ro
    environment:
      GCLOUD_OTLP_ENDPOINT: "${GCLOUD_OTLP_ENDPOINT}"
      GCLOUD_OTLP_USER: "${GCLOUD_OTLP_USER}"
      GCLOUD_OTLP_PASS: "${GCLOUD_OTLP_PASS}"
    depends_on:
      - postgres_exporter
      - redis_exporter
    networks:
      - linkchartnet
    # 12345 not published — internal debug UI only.

volumes:
  postgres_data:
  redis_data:

networks:
  linkchartnet:
    driver: bridge
  linkcharts-network:
    external: true
