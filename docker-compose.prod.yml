services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkchartapi
    restart: unless-stopped
    ports:
      - "8000:80"   # HTTP - Backend API
    volumes:
      - ./storage/logs:/var/www/storage/logs
      - ./storage/app:/var/www/storage/app
      - ./.env.production:/var/www/.env
    environment:
      - CONTAINER_ROLE=app
      - DB_HOST=linkchartdb
      - REDIS_HOST=linkchartredis
      - DB_CONNECTION=pgsql
      - DB_DATABASE=linkchartprod
      - DB_USERNAME=linkchartuser
      - DB_PASSWORD=CHANGE_ME_DB_PASSWORD
      - REDIS_CLIENT=phpredis
      - REDIS_PASSWORD=CHANGE_ME_REDIS_PASSWORD
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linkchartnet
      - linkcharts-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  database:
    image: postgres:15-alpine
    container_name: linkchartdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkchartprod
      POSTGRES_USER: linkchartuser
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - linkchartnet
      - linkcharts-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkchartuser -d linkchartprod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: linkchartredis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass CHANGE_ME_REDIS_PASSWORD
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - linkchartnet
      - linkcharts-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "CHANGE_ME_REDIS_PASSWORD", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: linkchart-pg-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring:${PG_MONITORING_PASSWORD}@linkchartdb:5432/linkchartprod?sslmode=disable"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - linkchartnet

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: linkchart-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://linkchartredis:6379"
      REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - linkchartnet

volumes:
  postgres_data:
  redis_data:

networks:
  linkchartnet:
    driver: bridge
  linkcharts-network:
    external: true
