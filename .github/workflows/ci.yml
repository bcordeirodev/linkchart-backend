name: 🧪 CI
# Nota: Laravel Pint está disponível no projeto mas não é executado no CI
# porque o código legado ainda não passou por uma normalização completa.
# Para normalizar: `docker compose exec app ./vendor/bin/pint`

on:
  pull_request:
  push:
    branches-ignore:
      - main  # push em main dispara deploy-production.yml, que já roda os mesmos checks

jobs:
  validate:
    name: Lint + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_ENV: testing
      APP_KEY: "base64:6Te5B+hW2AgrwEQi9uaO4f72snjcV1X6mVzmVrE+xKQ="
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      JWT_SECRET: test-secret-ci-not-for-production-use-only

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, zip, pdo_sqlite, redis, bcmath
          coverage: none

      - name: 📥 Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist --no-progress"

      - name: ✅ Run tests
        run: php artisan test
