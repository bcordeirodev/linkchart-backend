name: 🚀 Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force complete rebuild (no cache)'
        required: false
        default: false
        type: boolean

env:
  DEPLOY_HOST: 134.209.33.182
  PROJECT_PATH: /var/www/linkchartapi
  DOCKER_COMPOSE_FILE: docker-compose.prod.yml

jobs:
  deploy:
    name: 🏗️ Deploy to Production Server
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

    - name: 🌐 Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        echo "Host 134.209.33.182" >> ~/.ssh/config
        echo "    StrictHostKeyChecking no" >> ~/.ssh/config
        echo "    UserKnownHostsFile /dev/null" >> ~/.ssh/config
        echo "    ServerAliveInterval 60" >> ~/.ssh/config
        echo "    ServerAliveCountMax 3" >> ~/.ssh/config
        echo "    ConnectTimeout 30" >> ~/.ssh/config
        echo "    ConnectionAttempts 3" >> ~/.ssh/config

    - name: 🏥 Verificar Conectividade do Servidor
      run: |
        echo "🔍 Verificando conectividade SSH do servidor..."

        # Teste múltiplas portas para verificar conectividade
        echo "🔌 Testando conectividade em múltiplas portas..."

        # Teste porta SSH 22
        SSH_PORT_OK=false
        if timeout 10 nc -zv ${{ env.DEPLOY_HOST }} 22 2>/dev/null; then
          echo "✅ Porta SSH 22 acessível"
          SSH_PORT_OK=true
        else
          echo "⚠️ Porta SSH 22 não acessível via netcat"
        fi

        # Teste porta HTTP 80 (alternativa)
        HTTP_PORT_OK=false
        if timeout 10 nc -zv ${{ env.DEPLOY_HOST }} 80 2>/dev/null; then
          echo "✅ Porta HTTP 80 acessível"
          HTTP_PORT_OK=true
        else
          echo "⚠️ Porta HTTP 80 não acessível via netcat"
        fi

        # Teste HTTP endpoint (se disponível)
        HTTP_OK=false
        if timeout 15 curl -s --max-time 10 --connect-timeout 5 -o /dev/null http://${{ env.DEPLOY_HOST }}/health 2>/dev/null; then
          echo "✅ HTTP endpoint /health acessível"
          HTTP_OK=true
        elif timeout 15 curl -s --max-time 10 --connect-timeout 5 -o /dev/null http://${{ env.DEPLOY_HOST }}/ 2>/dev/null; then
          echo "✅ HTTP endpoint / acessível"
          HTTP_OK=true
        else
          echo "⚠️ HTTP endpoints não acessíveis"
        fi

        # Avaliar conectividade geral
        if [ "$SSH_PORT_OK" = false ] && [ "$HTTP_PORT_OK" = false ] && [ "$HTTP_OK" = false ]; then
          echo "❌ Nenhuma forma de conectividade detectada"
          echo "🔧 Possíveis causas:"
          echo "  1. Firewall bloqueando GitHub Actions IPs"
          echo "  2. Servidor completamente offline"
          echo "  3. Rate limiting agressivo"
          echo "  4. Problemas de rede temporários"
          exit 1
        else
          echo "✅ Pelo menos uma forma de conectividade detectada"
          if [ "$SSH_PORT_OK" = true ]; then
            echo "📡 SSH disponível - deploy pode prosseguir"
          else
            echo "⚠️ SSH via netcat falhou, mas tentaremos SSH direto"
          fi
        fi

        # Aguardar um pouco para evitar rate limiting
        echo "⏳ Aguardando para evitar rate limiting SSH..."
        sleep 5

        # Teste SSH com retry e configurações otimizadas
        SSH_SUCCESS=false
        for attempt in {1..3}; do
          echo "🔄 Tentativa SSH de conectividade $attempt/3..."

          if timeout 15 ssh \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            root@${{ env.DEPLOY_HOST }} "echo 'SSH Test OK'" >/dev/null 2>&1; then
            echo "✅ SSH conectividade OK na tentativa $attempt"
            SSH_SUCCESS=true
            break
          else
            echo "⚠️ SSH falhou na tentativa $attempt"
            if [ $attempt -lt 3 ]; then
              echo "⏳ Aguardando 10s antes da próxima tentativa..."
              sleep 10
            fi
          fi
        done

        if [ "$SSH_SUCCESS" = false ]; then
          echo "❌ SSH connection test failed após 3 tentativas"
          echo "🔧 Possíveis causas:"
          echo "  1. Rate limiting SSH devido a ataques brute force"
          echo "  2. GitHub Actions IPs bloqueados no firewall"
          echo "  3. Servidor sobrecarregado"
          echo "  4. Problema de rede temporário"
          echo "  5. SSH daemon com problemas"
          echo ""
          echo "💡 O deploy tentará continuar com retry logic mais robusto..."
          # Não falhar aqui, deixar o deploy tentar com sua própria lógica
        fi

    - name: 🚀 Deploy to Production Server
      run: |
        echo "🔄 Conectando ao servidor com retry logic robusto..."
        max_attempts=5
        delay=15

        # Teste rápido de conectividade antes de tentar deploy
        echo "🔌 Verificação final de conectividade..."
        if ! timeout 10 nc -zv ${{ env.DEPLOY_HOST }} 22 2>/dev/null; then
          echo "⚠️ Porta SSH não responde, mas continuando com retry logic..."
        fi

        for attempt in $(seq 1 $max_attempts); do
          echo "🔄 Tentativa SSH $attempt/$max_attempts..."

          # Aguardar progressivamente mais entre tentativas para evitar rate limiting
          if [ $attempt -gt 1 ]; then
            wait_time=$((delay * attempt))
            echo "⏳ Aguardando ${wait_time}s para evitar rate limiting..."
            sleep $wait_time

            # Testar conectividade novamente antes de tentar SSH
            echo "🔌 Re-testando conectividade..."
            timeout 5 nc -zv ${{ env.DEPLOY_HOST }} 22 2>/dev/null || echo "⚠️ Porta SSH ainda não responde"
          fi

          if ssh \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o TCPKeepAlive=yes \
            root@${{ env.DEPLOY_HOST }} << 'ENDSSH'
            set -e  # Exit on any error
            cd ${{ env.PROJECT_PATH }}

          # ==========================================
          # FUNÇÃO DE ROLLBACK ROBUSTA
          # ==========================================
          rollback() {
            echo "🔄 EXECUTANDO ROLLBACK DE EMERGÊNCIA..."

            # Parar containers atuais
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} down --timeout 60 || true

            # Restaurar backup mais recente
            BACKUP_FILE=$(ls -t .env.backup.* 2>/dev/null | head -1)
            if [ -n "$BACKUP_FILE" ]; then
              echo "📦 Restaurando backup: $BACKUP_FILE"
              cp "$BACKUP_FILE" .env
            else
              echo "📋 Usando .env.production como fallback (JWT_SECRET já incluído)"
              cp .env.production .env
            fi

            # Tentar subir versão anterior
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d

            echo "❌ ROLLBACK CONCLUÍDO - Verifique o sistema manualmente"
            exit 1
          }

          # ==========================================
          # LIMPEZA E PREPARAÇÃO
          # ==========================================
          echo "🧹 Preparando ambiente de produção..."

          # Limpar backups antigos (manter 7 mais recentes)
          ls -t .env.backup.* 2>/dev/null | tail -n +8 | xargs rm -f 2>/dev/null || true

          # Pull das mudanças mais recentes
          echo "⬇️ Baixando código atualizado..."
          git fetch origin
          git reset --hard origin/main

          # Backup do .env atual
          if [ -f .env ]; then
            echo "💾 Backup do .env atual..."
            cp .env .env.backup.$(date +%Y%m%d_%H%M%S)
          fi

          # ==========================================
          # CONFIGURAÇÃO DO AMBIENTE PRODUCTION
          # ==========================================
          echo "📋 Configurando ambiente de produção..."

          # Usar .env.production como base (seguindo padrão dev)
          echo "📋 Copiando .env.production para .env (JWT_SECRET já incluído)..."
          cp .env.production .env

          # ==========================================
          # VALIDAÇÕES CRÍTICAS
          # ==========================================
          echo "🔧 Validando configurações críticas..."

          # Verificar JWT_SECRET
          JWT_SECRET=$(grep 'JWT_SECRET=' .env | cut -d'=' -f2)
          JWT_LENGTH=${#JWT_SECRET}
          if [ "$JWT_LENGTH" -lt 32 ]; then
            echo "❌ JWT_SECRET muito curto ($JWT_LENGTH chars)"
            rollback
          fi
          echo "✅ JWT_SECRET configurado ($JWT_LENGTH chars)"

          # Validar configurações essenciais (.env.production)
          grep -q "APP_ENV=production" .env && echo "✅ APP_ENV=production" || { echo "❌ APP_ENV incorreto"; rollback; }
          grep -q "APP_DEBUG=false" .env && echo "✅ APP_DEBUG=false" || { echo "❌ APP_DEBUG incorreto"; rollback; }
          grep -q "DB_HOST=linkchartdb" .env && echo "✅ DB_HOST=linkchartdb" || { echo "❌ DB_HOST incorreto"; rollback; }
          grep -q "REDIS_HOST=linkchartredis" .env && echo "✅ REDIS_HOST=linkchartredis" || { echo "❌ REDIS_HOST incorreto"; rollback; }
          grep -q "DB_PASSWORD=" .env && echo "✅ DB_PASSWORD configurado" || { echo "❌ DB_PASSWORD ausente"; rollback; }
          grep -q "REDIS_PASSWORD=" .env && echo "✅ REDIS_PASSWORD configurado" || { echo "❌ REDIS_PASSWORD ausente"; rollback; }

          # Definir permissões corretas
          chmod 644 .env
          echo "✅ Permissões do .env configuradas"

          # ==========================================
          # DEPLOYMENT COM ESTRATÉGIA DEV FUNCIONAL
          # ==========================================
          echo "🛑 Parando containers atuais..."
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} down --timeout 60 || true

          # Limpeza opcional de imagens (baseado no dev)
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "🧹 Forçando rebuild completo..."
            docker system prune -f
            docker image prune -a -f
          else
            echo "🧹 Limpeza básica..."
            docker image prune -f
          fi

          # Build seguindo o padrão que funciona em dev
          echo "🏗️ Building aplicação..."
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build --no-cache --parallel
          else
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build --parallel
          fi

          # Iniciar serviços (igual ao dev)
          echo "🚀 Iniciando serviços de produção..."
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d

          # ==========================================
          # AGUARDAR HEALTH CHECKS (BASEADO NO DEV)
          # ==========================================
          echo "⏳ Aguardando serviços ficarem healthy..."

          # PostgreSQL Health Check
          echo "🗄️ Aguardando PostgreSQL..."
          timeout 120 bash -c '
            until docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} exec -T database pg_isready -U linkchartuser -d linkchartprod >/dev/null 2>&1; do
              echo "⏳ PostgreSQL iniciando..."
              sleep 5
            done
          ' || { echo "❌ PostgreSQL timeout"; rollback; }
          echo "✅ PostgreSQL healthy"

          # Redis Health Check
          echo "⚡ Aguardando Redis..."
          timeout 120 bash -c '
            until docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} exec -T redis redis-cli -a CHANGE_ME_REDIS_PASSWORD ping >/dev/null 2>&1; do
              echo "⏳ Redis iniciando..."
              sleep 5
            done
          ' || { echo "❌ Redis timeout"; rollback; }
          echo "✅ Redis healthy"

          # Laravel Application Health Check (similar ao dev)
          echo "🐘 Aguardando Laravel Application..."
          timeout 180 bash -c '
            until docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} ps | grep -q "linkchartapi.*Up"; do
              echo "⏳ Laravel iniciando..."
              sleep 10
            done
          ' || { echo "❌ Laravel timeout"; rollback; }
          echo "✅ Laravel Application running"

          # ==========================================
          # CONFIGURAÇÃO LARAVEL (IGUAL AO DEV)
          # ==========================================
          echo "⚙️ Configurando Laravel (baseado no padrão dev)..."

          # Aguardar PHP-FPM e Nginx estarem prontos
          sleep 15


          # ==========================================
          # SETUP DE DIRETÓRIOS E PERMISSÕES
          # ==========================================
          echo "🔧 Configurando diretórios e permissões..."

          # Copiar script de permissões (faz tudo: diretórios + ownership + permissões)
          docker cp docker/scripts/fix-permissions.sh linkchartapi:/var/www/fix-permissions.sh

          # Tornar script executável
          docker exec linkchartapi chmod +x /var/www/fix-permissions.sh

          # Executar configuração completa (diretórios + permissões)
          docker exec linkchartapi /var/www/fix-permissions.sh || { echo "❌ Erro na configuração de permissões"; rollback; }

          # ==========================================
          # CORREÇÃO ESPECÍFICA PARA CACHE GEOIP
          # ==========================================
          echo "🌐 Configurando cache para GeoIP..."

          # Garantir que diretórios de cache existem com estrutura completa
          docker exec linkchartapi mkdir -p /var/www/storage/framework/cache/data
          docker exec linkchartapi mkdir -p /var/www/storage/framework/cache/data/73
          docker exec linkchartapi mkdir -p /var/www/storage/framework/cache/data/73/08

          # Configurar permissões robustas para cache GeoIP
          echo "🔧 Aplicando permissões robustas para cache..."
          docker exec linkchartapi chmod -R 775 /var/www/storage/framework/cache
          docker exec linkchartapi chown -R www-data:www-data /var/www/storage/framework/cache

          # Garantir que subdiretórios específicos do GeoIP tenham permissões corretas
          docker exec linkchartapi find /var/www/storage/framework/cache/data -type d -exec chmod 775 {} \;
          docker exec linkchartapi find /var/www/storage/framework/cache/data -type f -exec chmod 664 {} \; 2>/dev/null || true

          # Verificar se www-data pode escrever no diretório de cache
          CACHE_WRITE_TEST=$(docker exec linkchartapi su -s /bin/sh www-data -c "touch /var/www/storage/framework/cache/data/geoip_test.tmp && rm /var/www/storage/framework/cache/data/geoip_test.tmp && echo 'SUCCESS' || echo 'FAILED'")
          
          if [ "$CACHE_WRITE_TEST" != "SUCCESS" ]; then
            echo "⚠️ www-data não consegue escrever no cache, aplicando correção..."
            docker exec linkchartapi chmod -R 777 /var/www/storage/framework/cache/data
            docker exec linkchartapi chown -R www-data:www-data /var/www/storage/framework/cache/data
          fi

          echo "✅ Cache GeoIP configurado corretamente"

          # Testar GeoIP após configuração
          echo "🧪 Testando GeoIP..."
          GEOIP_TEST_RESULT=$(docker exec linkchartapi php /var/www/artisan tinker --execute="
            try {
              \$geoip = app('geoip');
              \$location = \$geoip->getLocation('8.8.8.8');
              echo \$location->country ?: 'FAILED';
            } catch (Exception \$e) {
              echo 'FAILED: ' . \$e->getMessage();
            }
          " 2>/dev/null | tail -1)

          if [[ "$GEOIP_TEST_RESULT" == *"FAILED"* ]] || [ -z "$GEOIP_TEST_RESULT" ]; then
            echo "❌ ERRO: GeoIP não está funcionando - $GEOIP_TEST_RESULT"
            echo "🔧 Tentando correção emergencial de cache..."
            
            # Correção emergencial: permissões mais abertas
            docker exec linkchartapi chmod -R 777 /var/www/storage/framework/cache
            docker exec linkchartapi chown -R www-data:www-data /var/www/storage/framework/cache
            
            # Testar novamente
            GEOIP_TEST_RESULT_2=$(docker exec linkchartapi php /var/www/artisan tinker --execute="
              try {
                \$geoip = app('geoip');
                \$location = \$geoip->getLocation('8.8.8.8');
                echo \$location->country ?: 'FAILED';
              } catch (Exception \$e) {
                echo 'FAILED: ' . \$e->getMessage();
              }
            " 2>/dev/null | tail -1)
            
            if [[ "$GEOIP_TEST_RESULT_2" == *"FAILED"* ]] || [ -z "$GEOIP_TEST_RESULT_2" ]; then
              echo "❌ ERRO CRÍTICO: GeoIP falhou mesmo após correção emergencial"
              echo "🔍 Debug: $GEOIP_TEST_RESULT_2"
              rollback
            else
              echo "✅ GeoIP corrigido após permissões emergenciais: $GEOIP_TEST_RESULT_2"
            fi
          else
            echo "✅ GeoIP funcionando: $GEOIP_TEST_RESULT"
          fi

          # Verificação adicional: testar escrita real no cache GeoIP
          echo "🔍 Testando escrita real no cache GeoIP..."
          GEOIP_WRITE_TEST=$(docker exec linkchartapi php -r "
            try {
              \$cacheFile = '/var/www/storage/framework/cache/data/geoip_deploy_test_' . time();
              file_put_contents(\$cacheFile, 'test');
              unlink(\$cacheFile);
              echo 'SUCCESS';
            } catch (Exception \$e) {
              echo 'FAILED: ' . \$e->getMessage();
            }
          " 2>/dev/null)

          if [[ "$GEOIP_WRITE_TEST" == *"FAILED"* ]]; then
            echo "⚠️ Escrita no cache GeoIP falhou: $GEOIP_WRITE_TEST"
            echo "🔧 Aplicando correção final..."
            docker exec linkchartapi chmod -R 777 /var/www/storage/framework/cache/data
          else
            echo "✅ Escrita no cache GeoIP funcionando"
          fi

          # VERIFICAÇÃO CRÍTICA: Garantir que sistema de logs funciona ANTES de continuar
          echo "🔍 Verificação crítica do sistema de logs..."
          CURRENT_DATE=$(date +%Y-%m-%d)
          LOG_TEST_RESULT=$(docker exec linkchartapi sh -c "echo 'DEPLOY_TEST_LOG_ENTRY' >> /var/www/storage/logs/laravel-$CURRENT_DATE.log 2>&1 && echo 'SUCCESS' || echo 'FAILED'")

          if [ "$LOG_TEST_RESULT" != "SUCCESS" ]; then
            echo "❌ ERRO CRÍTICO: Sistema de logs não funciona após fix-permissions"
            echo "🔧 Aplicando correção emergencial de logs..."
            docker exec linkchartapi chmod -R 777 /var/www/storage/logs/
            docker exec linkchartapi chown -R www-data:www-data /var/www/storage/logs/
            docker exec linkchartapi chmod 666 /var/www/storage/logs/*.log 2>/dev/null || true

            # Testar novamente
            LOG_TEST_RESULT2=$(docker exec linkchartapi sh -c "echo 'DEPLOY_EMERGENCY_FIX_TEST' >> /var/www/storage/logs/laravel-$CURRENT_DATE.log 2>&1 && echo 'SUCCESS' || echo 'FAILED'")
            if [ "$LOG_TEST_RESULT2" != "SUCCESS" ]; then
              echo "❌ FALHA CRÍTICA: Sistema de logs não funciona mesmo após correção emergencial"
              rollback
            else
              echo "✅ Sistema de logs corrigido com sucesso"
            fi
          else
            echo "✅ Sistema de logs funcionando corretamente"
          fi

          # Laravel optimizations (seguindo padrão dev mas para prod)
          echo "⚡ Otimizações Laravel para produção..."
          docker exec linkchartapi php /var/www/artisan config:clear || { echo "❌ config:clear falhou"; rollback; }
          docker exec linkchartapi php /var/www/artisan cache:clear || { echo "❌ cache:clear falhou"; rollback; }
          docker exec linkchartapi php /var/www/artisan route:clear || { echo "❌ route:clear falhou"; rollback; }
          docker exec linkchartapi php /var/www/artisan view:clear || { echo "❌ view:clear falhou"; rollback; }

          # Storage link
          docker exec linkchartapi php /var/www/artisan storage:link || { echo "❌ storage:link falhou"; rollback; }

          # ==========================================
          # VERIFICAÇÃO E CORREÇÃO JWT_SECRET
          # ==========================================
          echo "🔐 Verificando JWT_SECRET no container..."

          # Verificar se JWT_SECRET está sendo lido corretamente
          JWT_FROM_ENV=$(docker exec linkchartapi cat /var/www/.env | grep 'JWT_SECRET=' | cut -d'=' -f2)
          echo "📋 JWT_SECRET do .env no container: ${#JWT_FROM_ENV} chars"

          # Limpar cache antes de recriar (crítico para JWT)
          echo "🧹 Limpando cache para JWT_SECRET..."
          docker exec linkchartapi php /var/www/artisan config:clear || { echo "❌ config:clear falhou"; rollback; }

          # Verificar JWT via env() ANTES do cache
          JWT_VIA_ENV=$(docker exec linkchartapi php /var/www/artisan tinker --execute="echo 'JWT_ENV:' . strlen(env('JWT_SECRET'));" 2>/dev/null | grep 'JWT_ENV:' | cut -d':' -f2 || echo "0")
          echo "🔍 JWT via env(): $JWT_VIA_ENV chars"

          if [ "$JWT_VIA_ENV" -lt 32 ]; then
            echo "❌ PROBLEMA CRÍTICO: env('JWT_SECRET') não funciona!"
            echo "📋 Conteúdo do .env no container:"
            docker exec linkchartapi head -20 /var/www/.env
            rollback
          fi

          # Cache para produção (DEPOIS da verificação JWT)
          echo "⚡ Recriando config cache com JWT_SECRET correto..."
          docker exec linkchartapi php /var/www/artisan config:cache || { echo "❌ config:cache falhou"; rollback; }

          # Verificar JWT APÓS config:cache
          JWT_FROM_CONFIG=$(docker exec linkchartapi php /var/www/artisan tinker --execute="echo 'JWT_CONFIG:' . strlen(config('jwt.secret'));" 2>/dev/null | grep 'JWT_CONFIG:' | cut -d':' -f2 || echo "0")
          echo "✅ JWT via config(): $JWT_FROM_CONFIG chars"

          if [ "$JWT_FROM_CONFIG" -lt 32 ]; then
            echo "❌ PROBLEMA CRÍTICO: config('jwt.secret') ainda está com placeholder!"
            echo "🔄 Tentando corrigir com force clear..."
          docker exec linkchartapi php /var/www/artisan optimize:clear
          docker exec linkchartapi php /var/www/artisan config:cache

            # Verificar novamente
            JWT_FROM_CONFIG_2=$(docker exec linkchartapi php /var/www/artisan tinker --execute="echo 'JWT_CONFIG2:' . strlen(config('jwt.secret'));" 2>/dev/null | grep 'JWT_CONFIG2:' | cut -d':' -f2 || echo "0")
            if [ "$JWT_FROM_CONFIG_2" -lt 32 ]; then
              echo "❌ JWT_SECRET ainda não funciona após force clear"
              rollback
            fi
            echo "✅ JWT corrigido após force clear: $JWT_FROM_CONFIG_2 chars"
          fi

          docker exec linkchartapi php /var/www/artisan route:cache || { echo "❌ route:cache falhou"; rollback; }
          docker exec linkchartapi php /var/www/artisan view:cache || { echo "❌ view:cache falhou"; rollback; }

          # ==========================================
          # EXECUTAR MIGRAÇÕES (ORDEM CORRETA - APÓS CONFIGURAÇÃO COMPLETA)
          # ==========================================
          echo "🗄️ Executando migrações de banco de dados (APÓS configuração completa)..."

          # Aguardar mais um pouco para garantir estabilidade total
          sleep 10

          # Verificar status das migrations primeiro
          echo "📋 Verificando status das migrations..."
          docker exec linkchartapi php /var/www/artisan migrate:status || { echo "❌ migrate:status falhou"; rollback; }

          # Executar migrations com retry logic melhorado
          echo "🔄 Executando migrations..."
          MIGRATION_SUCCESS=false
          for attempt in {1..5}; do
            echo "🔄 Tentativa de migration $attempt/5..."

            # Aguardar entre tentativas (exceto primeira)
            if [ $attempt -gt 1 ]; then
              wait_time=$((10 * attempt))
              echo "⏳ Aguardando ${wait_time}s antes da tentativa $attempt..."
              sleep $wait_time
            fi

            if docker exec linkchartapi php /var/www/artisan migrate --force; then
              echo "✅ Migrations executadas com sucesso na tentativa $attempt"
              MIGRATION_SUCCESS=true
              break
            else
              echo "⚠️ Migration falhou na tentativa $attempt"
              if [ $attempt -lt 5 ]; then
                echo "🔄 Tentando novamente..."
                # Mostrar logs para debug
                echo "📋 Últimas linhas do log Laravel:"
                docker logs linkchartapi --tail 10 2>/dev/null || echo "Não foi possível obter logs"
              fi
            fi
          done

          if [ "$MIGRATION_SUCCESS" = false ]; then
            echo "❌ ERRO CRÍTICO: Migrations falharam após 5 tentativas"
            echo "📋 Verificando logs do Laravel..."
            docker logs linkchartapi --tail 30
            rollback
          fi

          # Verificar status final das migrations
          echo "📋 Verificando status final das migrations..."
          docker exec linkchartapi php /var/www/artisan migrate:status

          echo "🎉 MIGRATIONS EXECUTADAS COM SUCESSO!"

          # ==========================================
          # CORREÇÃO FINAL DE PERMISSÕES (APÓS MIGRATIONS)
          # ==========================================
          echo "🔧 Aplicando correção final de permissões nos logs..."

          # Corrigir permissões dos logs que podem ter sido criados durante migrations
          # COMANDO TESTADO E APROVADO PELO USUÁRIO:
          docker exec linkchartapi chown -R www-data:www-data /var/www/storage/logs || echo "⚠️ Aviso: chown logs falhou"
          docker exec linkchartapi chmod -R 775 /var/www/storage/logs || echo "⚠️ Aviso: chmod logs falhou"
          docker exec linkchartapi chmod 666 /var/www/storage/logs/*.log 2>/dev/null || echo "⚠️ Aviso: chmod arquivos log falhou"

          # Testar se o sistema de logs funciona
          echo "🧪 Testando sistema de logs após migrations..."
          docker exec linkchartapi php -r "file_put_contents('/var/www/storage/logs/deploy-test.log', 'Deploy test: ' . date('Y-m-d H:i:s') . PHP_EOL, FILE_APPEND);" || {
            echo "❌ ERRO: Sistema de logs não funciona após migrations"
            echo "🔧 Aplicando correção emergencial..."
            docker exec linkchartapi chmod -R 777 /var/www/storage/logs/
            docker exec linkchartapi chown -R www-data:www-data /var/www/storage/logs/
          }

          echo "✅ Correção final de permissões concluída!"

          # ==========================================
          # VERIFICAÇÕES DE INTEGRIDADE
          # ==========================================
          echo "🧪 Verificações de integridade..."

          # Aguardar estabilização
          sleep 10

          # JWT já foi verificado acima - pular verificação duplicada

          # Verificar permissões críticas
          echo "🔍 Verificando permissões críticas..."

          LOGS_WRITABLE=$(docker exec linkchartapi test -w /var/www/storage/logs && echo "OK" || echo "FAIL")
          CACHE_WRITABLE=$(docker exec linkchartapi test -w /var/www/storage/framework/cache/data && echo "OK" || echo "FAIL")
          BOOTSTRAP_WRITABLE=$(docker exec linkchartapi test -w /var/www/bootstrap/cache && echo "OK" || echo "FAIL")

          echo "📋 Permissões status:"
          echo "  - storage/logs: $LOGS_WRITABLE"
          echo "  - framework/cache: $CACHE_WRITABLE"
          echo "  - bootstrap/cache: $BOOTSTRAP_WRITABLE"

          if [ "$LOGS_WRITABLE" != "OK" ] || [ "$CACHE_WRITABLE" != "OK" ] || [ "$BOOTSTRAP_WRITABLE" != "OK" ]; then
            echo "❌ Problemas de permissões detectados - aplicando correção emergencial"
            docker exec linkchartapi chmod -R 777 /var/www/storage/
            docker exec linkchartapi chmod -R 777 /var/www/bootstrap/cache/
            echo "✅ Correção emergencial aplicada"
          fi

          # VERIFICAÇÃO ADICIONAL: Testar escrita real em logs
          echo "🔍 Testando escrita real em logs..."
          CURRENT_DATE=$(date +%Y-%m-%d)
          LOG_WRITE_TEST=$(docker exec linkchartapi sh -c "echo '[$(date)] DEPLOY_INTEGRITY_CHECK: Log system operational' >> /var/www/storage/logs/laravel-$CURRENT_DATE.log 2>&1 && echo 'SUCCESS' || echo 'FAILED'")

          if [ "$LOG_WRITE_TEST" != "SUCCESS" ]; then
            echo "❌ ERRO: Sistema de logs falhou na verificação de integridade"
            echo "🔧 Aplicando correção final de logs..."
            docker exec linkchartapi chmod -R 777 /var/www/storage/logs/
            docker exec linkchartapi chown -R www-data:www-data /var/www/storage/logs/
            docker exec linkchartapi chmod 666 /var/www/storage/logs/*.log 2>/dev/null || true

            # Testar novamente
            LOG_WRITE_TEST2=$(docker exec linkchartapi sh -c "echo '[$(date)] DEPLOY_FINAL_FIX: Log system restored' >> /var/www/storage/logs/laravel-$CURRENT_DATE.log 2>&1 && echo 'SUCCESS' || echo 'FAILED'")
            if [ "$LOG_WRITE_TEST2" != "SUCCESS" ]; then
              echo "❌ FALHA CRÍTICA: Sistema de logs não funciona - continuando deploy mas com logs comprometidos"
            else
              echo "✅ Sistema de logs restaurado com sucesso"
            fi
          else
            echo "✅ Sistema de logs funcionando perfeitamente"
          fi

          # Testar Database Connection
          if docker exec linkchartapi php /var/www/artisan tinker --execute="try { DB::connection()->getPdo(); echo 'DB_OK'; } catch(Exception \$e) { echo 'DB_ERROR'; }" 2>/dev/null | grep -q "DB_OK"; then
            echo "✅ PostgreSQL connection OK"
          else
            echo "❌ PostgreSQL connection failed"
            rollback
          fi

          # Testar Redis Connection
          if docker exec linkchartapi php /var/www/artisan tinker --execute="try { Cache::store('redis')->put('test_key', 'test_value', 60); echo 'REDIS_OK'; } catch(Exception \$e) { echo 'REDIS_ERROR'; }" 2>/dev/null | grep -q "REDIS_OK"; then
            echo "✅ Redis connection OK"
          else
            echo "❌ Redis connection failed"
            rollback
          fi

          # ==========================================
          # HEALTH CHECK FINAL
          # ==========================================
          echo "🏥 Health check final da aplicação..."
          sleep 15

          # Tentar health check múltiplas vezes
          for i in {1..5}; do
            if curl -f -s --max-time 15 http://localhost:8000/health >/dev/null 2>&1; then
              echo "✅ Health check passou na tentativa $i"
              break
            else
              echo "⚠️ Health check falhou na tentativa $i"
              if [ $i -eq 5 ]; then
                echo "❌ Health check falhou após 5 tentativas"
                # Mostrar logs para debug
                echo "📋 Logs do container para debug:"
                docker logs linkchartapi --tail 50
                rollback
              fi
              sleep 20
            fi
          done

            echo "🎉 DEPLOYMENT DE PRODUÇÃO CONCLUÍDO COM SUCESSO!"
            echo "📊 Containers ativos:"
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} ps
        ENDSSH
          then
            echo "✅ SSH connection successful on attempt $attempt"
            break
          else
            echo "❌ SSH failed on attempt $attempt"
            if [ $attempt -eq $max_attempts ]; then
              echo "💥 SSH failed after $max_attempts attempts"
              echo "🔧 Troubleshooting steps:"
              echo "  1. SSH rate limiting due to brute force attacks"
              echo "  2. Check server status: ssh root@${{ env.DEPLOY_HOST }}"
              echo "  3. Check SSH logs: journalctl -u ssh -n 20"
              echo "  4. Restart SSH if needed: systemctl restart sshd"
              exit 1
            fi
            echo "⏳ SSH attempt failed, will retry with increased delay..."
          fi
        done

    - name: 🔍 Verificação Final de Produção
      run: |
        echo "🔍 Verificação final completa..."

        # Aguardar estabilização total
        sleep 20

        # Health Check Principal
        if curl -f -k -s --max-time 15 https://api.linkcharts.com.br/health; then
          echo "✅ Health check principal OK"
        else
          echo "❌ Health check principal falhou"
          exit 1
        fi

        # Teste API - deve retornar 401 (não autenticado)
        API_RESPONSE=$(curl -s -k -o /dev/null -w "%{http_code}" --max-time 15 https://api.linkcharts.com.br/api/links)
        case $API_RESPONSE in
          401)
            echo "✅ API protegida OK (401 - auth required)"
            ;;
          200|422)
            echo "⚠️ API respondeu $API_RESPONSE (verificar se esperado)"
            ;;
          *)
            echo "❌ API resposta inesperada: $API_RESPONSE"
            exit 1
            ;;
        esac

        # Verificar health endpoint detalhado
        HEALTH_FULL=$(curl -s -k --max-time 15 https://api.linkcharts.com.br/health)
        if [[ "$HEALTH_FULL" == *"OK"* ]] || [[ "$HEALTH_FULL" == *"healthy"* ]]; then
          echo "✅ Health endpoint detalhado OK"
          echo "📋 Health response: $HEALTH_FULL"
        else
          echo "⚠️ Health endpoint response: $HEALTH_FULL"
        fi

        echo "🎉 VERIFICAÇÃO DE PRODUÇÃO CONCLUÍDA!"

    - name: 📊 Monitoramento Pós-Deploy
      if: success()
      run: |
        echo "📊 Monitoramento pós-deployment..."

        ssh -o StrictHostKeyChecking=no root@${{ env.DEPLOY_HOST }} << 'ENDSSH'
          cd ${{ env.PROJECT_PATH }}

          echo "📋 Status final dos containers:"
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} ps

          echo ""
          echo "📈 Estatísticas de recursos:"
          docker stats --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}"

          echo ""
          echo "📝 Últimas 10 linhas do log da aplicação:"
          docker logs linkchartapi --tail 10

          echo ""
          echo "🔍 Verificação final de configuração:"
          docker exec linkchartapi php /var/www/artisan --version
          docker exec linkchartapi php /var/www/artisan env | grep -E "APP_ENV|APP_DEBUG|DB_CONNECTION|REDIS_CLIENT" || true
        ENDSSH

    - name: 📢 Notificação de Status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "🚀 PRODUÇÃO DEPLOYED COM SUCESSO!"
          echo ""
          echo "📊 Serviços Ativos:"
          echo "  ✅ Laravel API Application (PHP 8.2 + FPM)"
          echo "  ✅ PostgreSQL Database 15 (com health checks)"
          echo "  ✅ Redis Cache 7 (com auth)"
          echo "  ✅ Nginx Reverse Proxy"
          echo "  ✅ Supervisor Process Manager"
          echo "  ✅ JWT Authentication"
          echo "  ✅ CORS Configurado"
          echo ""
          echo "🌐 URLs de Produção:"
          echo "  🏠 Application: https://api.linkcharts.com.br"
          echo "  🏥 Health Check: https://api.linkcharts.com.br/health"
          echo "  📡 API Base: https://api.linkcharts.com.br/api"
          echo "  🔐 Auth: https://api.linkcharts.com.br/api/auth/login"
          echo ""
          echo "⏱️ Deploy concluído em: $(date)"
          echo "🔧 Baseado na estrutura dev funcional + .env.production"
        else
          echo "💥 FALHA NO DEPLOYMENT DE PRODUÇÃO!"
          echo ""
          echo "❌ Status: ${{ job.status }}"
          echo "🔍 Logs acima contêm detalhes do erro"
          echo "🔄 Rollback automático executado"
          echo ""
          echo "📞 Ações Necessárias:"
          echo "  1. ssh root@${{ env.DEPLOY_HOST }}"
          echo "  2. cd ${{ env.PROJECT_PATH }}"
          echo "  3. docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} ps"
          echo "  4. docker logs linkchartapi"
          echo "  5. Verificar .env.backup.* para versões anteriores"
          echo ""
          echo "💡 Rollback executado - sistema deve estar na versão anterior"
        fi
